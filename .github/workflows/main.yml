name: Build and Deploy TGP Management

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Install, Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil source code dari repositori
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup runtime Node.js v20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install seluruh dependencies (npm install tanpa lockfile restriction)
      - name: Install Dependencies
        run: npm install

      # 4. Build aplikasi ke folder dist/ dengan kredensial Supabase
      - name: Build Application with Supabase
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

      # 5. Publikasikan aplikasi ke GitHub Pages (branch gh-pages)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      # 6. Simpan hasil build di tab Actions (Downloadable Artifact)
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgp-management-app-dist
          path: dist/
