name: Unzip, Commit & Deploy TGP Management App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  unzip-and-deploy:
    name: Unzip, Commit Files & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 1. Ekstrak ZIP langsung dan COMMIT hasilnya ke dalam repositori GitHub Anda
      - name: Extract ZIP and Commit to Repo
        run: |
          if compgen -G "*.zip" > /dev/null; then
            echo "Ditemukan file zip. Memulai proses ekstraksi..."
            mkdir -p temp_extracted
            for z in *.zip; do
              echo "📦 Mengekstrak: $z..."
              unzip -o "$z" -d temp_extracted/
            done

            # Deteksi jika isi zip berada di dalam subfolder tunggal
            SUBDIRS=(temp_extracted/*)
            if [ ${#SUBDIRS[@]} -eq 1 ] && [ -d "${SUBDIRS[0]}" ] && [ ! -f "temp_extracted/package.json" ]; then
              echo "Mendeteksi folder induk di dalam ZIP, memindahkan ke root repositori..."
              shopt -s dotglob
              mv "${SUBDIRS[0]}"/* .
              shopt -u dotglob
            else
              shopt -s dotglob
              mv temp_extracted/* .
              shopt -u dotglob
            fi
            rm -rf temp_extracted *.zip

            # Simpan dan push seluruh file hasil unzip ke GitHub
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            if ! git diff-index --quiet HEAD; then
              echo "✅ Mengunggah file hasil unzip ke GitHub repository..."
              git commit -m "Auto-extract application files into repository [skip ci]"
              git push origin HEAD
            else
              echo "File sudah up-to-date."
            fi
          else
            echo "ℹ️ Tidak ada file zip baru, menggunakan file repositori yang ada."
          fi

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 2. Install dependencies
      - name: Install Dependencies
        run: npm install

      # 3. Kompilasi aplikasi (build)
      - name: Build Application
        run: npm run build

      # 4. Deploy otomatis ke branch gh-pages
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      # 5. Buat downloadable artifact di tab Actions
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgp-management-production-build
          path: dist/
