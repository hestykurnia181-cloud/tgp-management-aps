name: Ekstrak File ZIP Proyek

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-commit:
    name: Ekstrak ZIP ke Repositori
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositori
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Ekstrak File ZIP
        run: |
          echo "Memulai proses ekstraksi file zip..."
          
          shopt -s nullglob
          zips=(*.zip)
          
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Tidak ditemukan file .zip di repositori. Mungkin sudah terekstrak."
            ls -la
            exit 0
          fi

          mkdir -p temp_extracted
          for zip_file in "${zips[@]}"; do
            echo "📦 Mengekstrak file: $zip_file"
            unzip -o "$zip_file" -d temp_extracted/
          done

          # Amankan folder .github agar workflow yang berjalan tidak tertimpa
          rm -rf temp_extracted/.github

          # Gunakan cp -rf untuk menggabungkan folder secara aman tanpa error 'Directory not empty'
          echo "Menyalin seluruh file hasil ekstrak ke repositori..."
          cp -rf temp_extracted/. .

          # Hapus folder sementara dan file zip
          rm -rf temp_extracted
          rm -f *.zip

          echo "Daftar file berhasil diekstrak:"
          ls -la

      - name: Simpan dan Push File ke Repositori GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan file baru."
          else
            git commit -m "Ekstrak file source code dari ZIP"
            git push origin HEAD
            echo "✅ Selesai! Seluruh file berhasil diekstrak dan masuk ke repositori."
          fi
