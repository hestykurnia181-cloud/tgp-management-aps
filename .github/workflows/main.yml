name: Build and Deploy TGP Management

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Extract, Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Setup Node.js v20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Ekstrak ZIP dan siapkan file di root
      - name: Extract ZIP and Prepare Files
        run: |
          echo "🔍 Memeriksa file .zip di repositori..."
          
          shopt -s nullglob
          zip_files=(*.zip)
          if [ ${#zip_files[@]} -gt 0 ]; then
            for z in "${zip_files[@]}"; do
              echo "📦 Mengekstrak: $z..."
              unzip -q -o "$z" -d .
            done
          fi

          # Jika package.json ada di subfolder, pindahkan ke root
          if [ ! -f "package.json" ]; then
            echo "⚠️ Mencari package.json di subfolder..."
            PKG_PATH=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" -not -path "*/.*/*" | head -n 1)
            if [ -n "$PKG_PATH" ]; then
              PROJECT_DIR=$(dirname "$PKG_PATH")
              echo "📁 Ditemukan di: $PROJECT_DIR, memindahkan ke root..."
              shopt -s dotglob
              mv "$PROJECT_DIR"/* .
              shopt -u dotglob
              rm -rf "$PROJECT_DIR"
            fi
          fi

          if [ ! -f "package.json" ]; then
            echo "❌ File package.json tidak ditemukan!"
            ls -la
            exit 1
          fi

          echo "✅ package.json siap di root repositori!"

      # 4. Simpan file yang sudah diekstrak ke halaman GitHub Anda & hapus zip
      - name: Commit and Push Extracted Files to GitHub
        run: |
          rm -f *.zip
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff-index --quiet HEAD; then
            echo "📝 Mengunggah file hasil ekstrak ke halaman repositori GitHub..."
            git commit -m "Auto-extract files into repository [skip ci]"
            git push origin HEAD || echo "Push dilewati."
          fi

      # 5. Install dependencies
      - name: Install Dependencies
        run: npm install

      # 6. Build aplikasi ke dist/ dengan menyertakan env Supabase
      - name: Build Application with Supabase
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

      # 7. Simpan hasil build ke branch gh-pages (GitHub Pages)
      - name: Deploy to gh-pages branch
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      # 8. Upload file build sebagai Artifact (dapat didownload di tab Actions)
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgp-management-app-dist
          path: dist/
