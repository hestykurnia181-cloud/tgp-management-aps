name: Ekstrak File ZIP Proyek

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-commit:
    name: Ekstrak ZIP ke Repositori
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositori
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Ekstrak File ZIP
        run: |
          echo "Memulai proses ekstraksi file zip..."
          
          shopt -s nullglob
          zips=(*.zip)
          
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Tidak ditemukan file .zip di repositori. Mungkin sudah terekstrak."
            ls -la
            exit 0
          fi

          for zip_file in "${zips[@]}"; do
            echo "📦 Mengekstrak file: $zip_file"
            unzip -o "$zip_file" -d temp_extracted/
          done

          # Cek jika isi file terbungkus di dalam subfolder
          items=(temp_extracted/*)
          if [ ${#items[@]} -eq 1 ] && [ -d "${items[0]}" ]; then
            echo "Isi file berada di dalam subfolder, memindahkan ke root..."
            shopt -s dotglob
            mv "${items[0]}"/* .
            shopt -u dotglob
          else
            echo "Memindahkan isi temp_extracted ke root..."
            shopt -s dotglob
            mv temp_extracted/* .
            shopt -u dotglob
          fi

          # Hapus folder sementara dan file zip
          rm -rf temp_extracted
          rm -f *.zip

          echo "Daftar file setelah diekstrak:"
          ls -la

      - name: Simpan dan Push File ke Repositori GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan file baru."
          else
            git commit -m "Ekstrak file source code dari ZIP"
            git push origin HEAD
            echo "✅ Selesai! Seluruh file berhasil diekstrak dan masuk ke repositori."
          fi
