name: Build Android APK & Web App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk-and-web:
    name: Build Android APK (.apk) & Web
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil source code dari repositori
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js v20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Setup Java 21 untuk kompilasi Android APK (Capacitor Android membutuhkan Java 21)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install dependensi Node.js & Capacitor untuk Android
      - name: Install Dependencies & Capacitor
        run: |
          npm install
          npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android

      # 6. Build aplikasi web ke folder dist/ dengan kredensial Supabase
      - name: Build Web Application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

      # 7. Inisialisasi proyek Android Capacitor & Build APK
      - name: Build Android APK
        run: |
          echo "📱 Menginisialisasi proyek Android..."
          npx cap init "TGP Management" "com.tgp.management" --web-dir dist
          npx cap add android || echo "Android folder already exists"
          npx cap sync android
          
          echo "🔨 Mengompilasi file .apk dengan Gradle..."
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
          # Pindahkan dan simpan file APK dengan nama yang rapi
          cd ..
          mkdir -p apk_output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk_output/TGP-Management.apk
          echo "✅ Berhasil membuat file APK!"
          ls -lh apk_output/

      # 8. Upload File APK Android (.apk) ke tab Artifacts
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TGP-Management-APK
          path: apk_output/TGP-Management.apk

      # 9. Publikasikan versi Web ke GitHub Pages
      - name: Deploy Web to GitHub Pages
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
