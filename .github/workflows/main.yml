name: Unzip and Setup TGP Management App

on:
  workflow_dispatch:
    inputs:
      zip_filename:
        description: 'Nama file ZIP (opsional, kosongkan jika ingin deteksi otomatis)'
        required: false
        default: ''
      target_directory:
        description: 'Direktori tujuan ekstraksi'
        required: false
        default: '.'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  extract-and-build:
    name: Unzip and Build Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Ekstrak file zip jika tersedia di repositori
      - name: Extract ZIP File
        run: |
          TARGET_DIR="${{ github.event.inputs.target_directory || '.' }}"
          mkdir -p "$TARGET_DIR"

          SPECIFIED_ZIP="${{ github.event.inputs.zip_filename }}"

          if [ -n "$SPECIFIED_ZIP" ] && [ -f "$SPECIFIED_ZIP" ]; then
            echo "📦 Mengekstrak file spesifik: $SPECIFIED_ZIP..."
            unzip -o "$SPECIFIED_ZIP" -d "$TARGET_DIR"
          elif compgen -G "*.zip" > /dev/null; then
            for z in *.zip; do
              echo "📦 Mengekstrak file zip ditemukan: $z..."
              unzip -o "$z" -d "$TARGET_DIR"
            done
          else
            echo "ℹ️ Tidak ada file zip yang perlu diekstrak. Menggunakan struktur file repositori langsung."
          fi

      - name: Install Dependencies
        run: npm install

      - name: Type Check and Lint
        run: npm run lint

      - name: Build Application
        run: npm run build
