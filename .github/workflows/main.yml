name: Build and Deploy TGP Management

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build & Deploy Application
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil source code dari repositori
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup environment Node.js v20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install seluruh paket dependencies
      - name: Install Dependencies
        run: npm install

      # 4. Kompilasi aplikasi (Build ke folder dist/)
      - name: Build Application with Supabase
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

      # 5. Publikasikan aplikasi otomatis ke GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      # 6. Upload file bundle siap pakai ke tab Actions (dapat didownload)
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgp-management-production-build
          path: dist/
